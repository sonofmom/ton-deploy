---
# Shared defaults for the gton playbooks.
#
# Playbook-adjacent group_vars sit at the bottom of Ansible's precedence
# order, so anything here can be overridden from the inventory, from a play's
# own `vars:` or with -e. Node role flags (validator_enabled,
# liteserver_enabled, collator_enabled) differ between the plays and live in
# the plays themselves.
#
# Conventions
#   *_path       directory            *_file  file            *_url  URL
#   *_enabled    feature flag, always read with `| bool`
#   <role>_pk    base64 private key seed
#   <role>_pub   base64 public key
#   <role>_id    base64 ADNL short id
#   cpp_*        values that describe or are read from the C++ node being migrated
#   ""           not set: empty ports and keys are generated by the configure
#                tasks, or read from the C++ node by the migration play

# gton node layout
home_path: "/opt/gton/node"
db_path: "{{ home_path }}/db"
etc_path: "{{ home_path }}/etc"
src_path: "{{ home_path }}/src"
bin_path: "{{ home_path }}/bin"
log_path: "{{ home_path }}/logs"
log_file: "{{ log_path }}/node.log"
log_level: "info"

# sources
repository_url: "https://github.com/xssnick/gton.git"
repository_version: "master"
global_config_url: "https://ton-blockchain.github.io/testnet-global.config.json"
tools_repository_url: "https://github.com/sonofmom/ton-deploy.git"
tools_path: "/opt/ton-deploy"

# systemd service
service_enabled: true
service_start: true
service_name: "gton-node"
service_user: "gton"
service_path: "/etc/systemd/system"
service_file: "{{ service_path }}/{{ service_name }}.service"
service_template_file: "{{ playbook_dir }}/../assets/templates/gton-node-service.j2"

# optional features
metrics_enabled: false
ufw_enabled: true
rsyslog_config_file: ""

# network identity, generated when empty
external_ip: ""
fullnode_port: ""
fullnode_quic_port: ""
consensus_port: ""
consensus_quic_port: ""
dht_port: ""
console_port: ""
liteserver_port: ""
metrics_port: ""

# key material, generated (or read from the C++ node) when empty
fullnode_pk: ""
consensus_pk: ""
console_server_pk: ""
console_client_pk: ""
liteserver_pk: ""

# custom overlays in gton config format, taken from the C++ node when empty
custom_overlays: []
